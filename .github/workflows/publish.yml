name: Publish web app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check the scrcpy server file
        # Official checksum of scrcpy-server-v3.3.3 (from scrcpy's doc/build.md)
        run: echo "7e70323ba7f259649dd4acce97ac4fefbae8102b2c6d91e2e7be613fd5354be0  web/scrcpy-server.bin" | sha256sum --check

      - name: Build the web app
        run: npm run build

      - name: Publish to GitHub Pages (gh-pages branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          force_orphan: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
